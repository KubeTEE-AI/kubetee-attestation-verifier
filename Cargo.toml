[package]
name = "kubetee-attestation-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Independent, fail-closed AMD SEV-SNP verifier for the KubeTEE TEE attestation envelope (kubetee.attestation.v1)"
license = "Apache-2.0"
repository = "https://github.com/KubeTEE-AI/kubetee-attestation-verifier"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
# pkcs1v15: rsa 0.10 moved the PKCS#1 v1.5 signature module behind this
# feature (it was always-on in 0.9). The `sha2` feature from 0.9 is REMOVED
# (sha2 is a hard dep, re-exported as `rsa::sha2`) — enabling it fails
# dependency resolution. `encoding` (default) provides `rsa::pkcs1`.
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sev = { version = "9.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
sha2 = "0.11.0"
spki = "0.8.1"
thiserror = "2.0.21"
x509-cert = { version = "0.3.0", features = ["pem"] }
